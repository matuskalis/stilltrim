name: CI

# Runs on macos-26 with Xcode 26.6, the image's default. Xcode 26.1.1 is on that image without an
# iOS simulator runtime, so it cannot build for a simulator there.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Free on public repositories. While the repository is private, macOS minutes cost money,
    # so pushes skip this job. Run it by hand with "Run workflow" when needed.
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install XcodeGen
        run: |
          curl -sSL -o xg.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  xg.zip" | shasum -a 256 -c -
          unzip -q xg.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      # The Vision tests need the Neural Engine or a GPU. A virtual machine may have neither, so they
      # stay local (scripts/verify.sh runs them on a real Mac).
      - name: Unit tests
        run: cd Packages/CleanupCore && swift test --skip 'FingerprintTests/vision' --skip 'FingerprintTests/ourDistance' --skip ScreenshotAnalyzerTests

      - name: Build for the simulator
        run: |
          xcodegen generate
          xcodebuild -project Stilltrim.xcodeproj -scheme Stilltrim -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build build

      - name: Privacy guard
        run: scripts/check-no-network.sh
