name: Stilltrim
options:
  bundleIdPrefix: com.matuskalis
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
packages:
  CleanupCore:
    path: Packages/CleanupCore
targets:
  Stilltrim:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: CleanupCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Stilltrim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryUsageDescription: The app checks your photos on this phone to find screenshots, similar shots and blurry photos, and deletes only what you choose.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    postBuildScripts:
      - name: Privacy guard for the built app
        script: '"${SRCROOT}/scripts/check-built-app.sh" "${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}"'
        basedOnDependencyAnalysis: false
  StilltrimUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Stilltrim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
schemes:
  # Run, build and archive. No tests: pressing Test with a phone selected must never delete its photos.
  Stilltrim:
    build:
      targets:
        Stilltrim: all
    run:
      config: Debug
  # Simulator only. These tests delete and erase things, and skip themselves on a device.
  Stilltrim-UITests:
    build:
      targets:
        Stilltrim: all
        StilltrimUITests: [test]
    run:
      config: Debug
    test:
      targets:
        - StilltrimUITests
